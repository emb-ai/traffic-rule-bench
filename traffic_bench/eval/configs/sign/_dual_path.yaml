# @package _global_
# Private base for dual-path signs: 5.7.x, 4.1.x, 3.18.x, 3.1.
# Sign yamls: `defaults: [_dual_path]` then `sign:`.
# Override once here, or on the CLI:
#   python generate_manifest.py sign=direction_straight scenario.dual_path_route_budget_m=200

augmentation:
  layout: true           # dual-path (forbidden short + compliant long)
  auxiliary: false

auxiliary:
  enabled: false

scenario:
  min_dual_path_gain_m: 20.0
  dual_path_route_budget_m: 150

simulation:
  horizon: 800
  spawn_velocity_ms: 2.5
  n_variations: 3
  profile_density_cap: 1.0
  sign_distance_before_end: 0.0
  spawn_distance_before_end: 20.0

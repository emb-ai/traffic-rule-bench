# Hydra root. Select a sign config, then overrides.
#   python -m traffic_bench.eval manifest sign=yield
#   python -m traffic_bench.eval manifest sign=direction/right
#   python -m traffic_bench.eval manifest sign=yield paths.split=train
# debug → data/runs/<sign>/debug/<timestamp>/ ; train/test refuse overwrite

defaults:
  - _self_
  - sign: main_road
  # Shared knobs live in configs/shared/ and are pulled by sign yaml defaults.

hydra:
  run:
    dir: ${repo:${paths.output_base}}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

paths:
  scenes_dir: data/scenes/${sign}
  output_base: data/runs/${sign}
  split: debug
  experiment_name: ${run_folder:${paths.split}}

scenario:
  max_scenarios: 10
  max_total: null # for debugging

augmentation:
  enabled: true
  layout: false
  auxiliary: false

auxiliary:
  enabled: false
  distance_from_intersection: 20.0
  convoy_size: 3
  lanes_occupied: 4
  convoy_gap_m: [5.0, 8.0]
  release_when_ego_within_m: 15.0

simulation:
  spawn_velocity_ms: 2.5
  traffic_density: 0.0
  horizon: 600
  sign_distance_before_end: 0.0
  spawn_distance_before_end: 15.0
  # NPC world: sample_one_profile this many times per geometry (all signs).
  n_variations: 3
  profile_density_cap: 1.0
  # Ego route budgets (m). One value → fixed length; several → expand axis.
  max_path_length_m: 100.0
  max_path_length_levels: [90, 100, 110]

gif:
  enabled: false
  policy: idm
  max_scenes: null
  dry_run: false
  hide_signs: true
  dir: null
  run_name: null
  window_m: 60
  draw_path_conflict: false  # cyan/magenta routes + yellow conflict X on GIFs
  # Optional; carl/carl_rule/plant2/plant2_rule default to pretrained:
  #   carl*:      traffic-bench/checkpoints/carl/nuplan_51479_1B/model_best.pth
  #   plant2*:    traffic-bench/checkpoints/plant2_pretrain/epoch=029_final_3.ckpt
  #   plant2_ft:  newest *.ckpt under traffic-bench/checkpoints/plant2_finetuned/
  model_path: null

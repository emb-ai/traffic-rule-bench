# @package _global_

augmentation:
  layout: true
  auxiliary: false

auxiliary:
  enabled: false

scenario:
  max_scenarios: 10
  max_total: null
  max_ego_lanes: 3
  max_pedestrian_presets: 3
  crosswalk_positions: [middle]

simulation:
  spawn_velocity_ms: 2.5
  sign_distance_before_end: 12.0
  spawn_distance_before_end: 50.0
  min_hops_after_depart: 0
  # 50 m spawn before the zebra; 60 m would leave almost no post-crossing dest.
  max_path_length_levels: [90, 120]

gif:
  window_m: 130

pedestrian:
  default_ego_spawn_distance_m: 50.0
  default_speed_mean: 1.2
  default_speed_std: 0.2
  default_spawn_gap_s: 2.5
  # Expert rest line = max(yield_distance, no_stop_before) before the zebra.
  # 3 m matches the no-stop band edge so NN rule agents stop before tip-in.
  yield_distance: 3.0
  no_stop_before_crosswalk_m: 3.0

# @package _global_
# Shared knobs for bus_lane / bike_lane / bus_lane_road / bike_lane_road.

paths:
  scenes_dir: scenes

augmentation:
  layout: false
  auxiliary: false

scenario:
  max_scenarios: 10
  max_total: null

simulation:
  spawn_velocity_ms: 5.0
  spawn_offset_from_start: 10.0
  spawn_distance_before_end: 80.0
  sign_distance_before_end: 12.0
  # Ego starts this far before the plate (expert pre-empts 50 m ahead).
  approach_before_sign_m: 60.0
  # Reserved-lane zone after the plate; the finish lies past its end.
  restricted_zone_m: 60.0
  tail_after_sign_m: 10.0
  max_path_length_m: 150.0
  max_path_length_levels: [150]

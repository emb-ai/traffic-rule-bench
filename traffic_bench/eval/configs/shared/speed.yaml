# @package _global_
# Shared knobs for speed_limit / min_speed / residential_zone / zone_speed_limit.

paths:
  scenes_dir: scenes

augmentation:
  layout: false
  auxiliary: false

scenario:
  max_scenarios: 10
  max_total: null
  max_density_levels: 3

simulation:
  horizon: 400
  spawn_velocity_ms: 5.0
  traffic_density: 0.0
  traffic_density_augment: true
  spawn_offset_from_start: 5.0
  spawn_distance_before_end: 80.0
  sign_distance_before_end: 12.0
  max_ego_lanes: 8
  zone_tail_m: 8.0
  zone_min_m: 20.0

# @package _global_
# Shared base for speed-family signs 3.24 / 4.6 / 5.21 / 5.31.
# Sign yamls: `defaults: [_speed]` then only `sign` + `paths.output_base`.
#
# Manifest expansion / braking-accel spawn are not wired yet.
# Scenes: moscow_scenes/scenes/segment/straight (crop_kind: segment).

paths:
  scenes_dir: scenes
  split: all

augmentation:
  layout: false
  auxiliary: false

scenario:
  max_scenarios: 10
  max_total: null
  max_density_levels: 3

simulation:
  horizon: 400
  spawn_velocity_ms: 5.0
  traffic_density: 0.0
  traffic_density_augment: true
  spawn_offset_from_start: 5.0
  max_path_length_m: 150.0
  spawn_distance_before_end: 80.0
  sign_distance_before_end: 12.0
  max_ego_lanes: 8
  zone_tail_m: 8.0
  zone_min_m: 20.0

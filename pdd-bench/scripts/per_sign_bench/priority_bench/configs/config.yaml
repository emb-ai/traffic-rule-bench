# Priority junction bench — 2.1 main_road / 2.4 yield
#   python generate_manifest.py
#   python generate_manifest.py sign=yield

defaults:
  - sign: main_road
  - _self_

hydra:
  run:
    dir: ${paths.output_base}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

paths:
  scenes_dir: scenes
  experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

scenario:
  n_variants: 1
  augment: true
  max_scenarios_per_scene: 15
  respect_scene_selection: true

simulation:
  spawn_velocity_ms: 2.5
  traffic_density: 0.0
  horizon: 600
  sign_distance_before_end: 0.0
  # Closer spawn so ego approaches the yield stop (~5 m) without a long idle.
  spawn_distance_before_end: 12.0

auxiliary:
  enabled: true
  distance_from_intersection: 20.0
  convoy_size: 3
  lanes_occupied: 4
  convoy_gap_m: 10.0
  # Release as soon as ego is at/near spawn (must be >= spawn_distance_before_end
  # or gated aux and a yielding ego deadlock far from the junction).
  release_when_ego_within_m: 15.0

gif:
  enabled: false
  policy: idm
  max_scenes: null
  dry_run: false
  hide_signs: true
  dir: null
  run_name: null
  scaling: 12.0   # pixels per meter (higher = more zoomed in)

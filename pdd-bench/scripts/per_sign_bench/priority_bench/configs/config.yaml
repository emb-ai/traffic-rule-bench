# Priority junction bench — 2.1 main_road / 2.4 yield
#   python generate_manifest.py
#   python generate_manifest.py sign=yield

defaults:
  - _self_
  - sign: main_road

hydra:
  run:
    dir: ${paths.output_base}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

paths:
  scenes_dir: scenes
  experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

scenario:
  max_scenarios: 15

augmentation:
  enabled: true
  layout: false
  auxiliary: false

auxiliary:
  enabled: false
  distance_from_intersection: 20.0
  convoy_size: 3
  lanes_occupied: 4
  convoy_gap_m: [5.0, 10.0]
  release_when_ego_within_m: 15.0

simulation:
  spawn_velocity_ms: 2.5
  traffic_density: 0.0
  horizon: 600
  sign_distance_before_end: 0.0
  spawn_distance_before_end: 15.0

gif:
  enabled: false
  policy: idm
  max_scenes: null
  dry_run: false
  hide_signs: true
  dir: null
  run_name: null
  scaling: 12.0   # pixels per meter (higher = more zoomed in)

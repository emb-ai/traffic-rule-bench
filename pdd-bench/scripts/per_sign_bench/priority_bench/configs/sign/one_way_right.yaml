# @package _global_
sign: one_way_right
paths:
  output_base: data/one_way_right/output

augmentation:
  layout: true           # dual-path (forbidden short + compliant long)
  auxiliary: false

auxiliary:
  enabled: false

scenario:
  min_dual_path_gain_m: 20.0
  # Shared travel budget (m) for baseline + compliant path truncation.
  # horizon=800 @ ~6–8 m/s → ~480–640 m; 500 keeps most shorts intact.
  dual_path_route_budget_m: 500.0

simulation:
  horizon: 800
  spawn_velocity_ms: 2.5
  n_variations: 3
  profile_density_cap: 1.0
  sign_distance_before_end: 0.0
  spawn_distance_before_end: 20.0

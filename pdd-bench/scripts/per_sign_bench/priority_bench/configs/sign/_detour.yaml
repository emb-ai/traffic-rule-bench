# @package _global_
# Shared base for detour signs 4.2.1 / 4.2.2 / 4.2.3.
# Sign yamls: `defaults: [_detour]` then only `sign` + `paths.output_base`.

paths:
  scenes_dir: scenes
  split: all

augmentation:
  layout: false
  auxiliary: false

scenario:
  max_scenarios: 10
  max_total: null
  max_density_levels: 3

simulation:
  horizon: 400
  spawn_velocity_ms: 5.0
  traffic_density: 0.0
  traffic_density_augment: true
  spawn_offset_from_start: 10.0
  max_path_length_m: 150.0
  # Fallback for the shared SimulationConfig field (detour spawn uses offset).
  spawn_distance_before_end: 80.0
  # Sign is placed at sign_s from meta; this is unused at runtime for detour.
  sign_distance_before_end: 12.0

gif:
  window_m: 70

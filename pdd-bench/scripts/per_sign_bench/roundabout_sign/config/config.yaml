# Roundabout Sign Benchmark Configuration
# See README.md for parameter descriptions

defaults:
  - _self_

# Hydra output directory configuration
hydra:
  run:
    dir: ${paths.output_base}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

# =============================================================================
# Path Configuration
# =============================================================================
paths:
  scenes_dir: scenes
  output_base: benchmark_output/4_3
  experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

# =============================================================================
# Scenario Generation
# =============================================================================
scenario:
  n_variants: 1                   # Variants per scene (non-augmented mode)
  augment: true                   # Enable ego/aux spawn point enumeration
  max_exit_destinations_per_spawn: null  # Limit outbound roundabout exits per ego spawn (null = all)
  max_core_scenarios: 105         # Cap entry-level cores (scene + incoming road); round-robin across scenes
  max_scenarios_per_scene: 20     # Cap lane/convoy/lanes_occupied variants per core scenario (null = all)
  validate_metadrive_routes: true # Drop candidate routes that MetaDrive navigation cannot follow
  min_ego_lane_m: 10.0           # Min spoke/sign-approach lane length for ego spawn enumeration
  respect_scene_selection: true  # Skip scenes marked reject in scene_selection.json

# =============================================================================
# Simulation Parameters
# =============================================================================
simulation:
  spawn_velocity_ms: 2.5          # Ego initial velocity (m/s)
  traffic_density: 0.0            # Background traffic [0.0 - 1.0]
  horizon: 600                    # Max simulation steps
  sign_distance_before_end: 0.0   # Sign offset from lane end (m)
  spawn_distance_before_end: 5.0 # Ego spawn offset from lane end (m)

# =============================================================================
# Auxiliary Agents (Main Road Traffic)
# =============================================================================
auxiliary:
  enabled: true                   # Spawn agents on main road
  distance_from_intersection: 20.0  # Aux spawn offset from lane end (m)
  convoy_size: 1                  # Vehicles per lane
  lanes_occupied: 1               # Main road lanes to occupy
  convoy_gap_m: 10.0              # Gap between convoy vehicles (m)

# =============================================================================
# GIF Visualization
# =============================================================================
gif:
  enabled: false                   # Generate visualization GIFs
  policy: idm                     # Policy for rendering (good driving, no sign rules)
  max_scenes: null                # Limit GIFs (null = all)
  dry_run: false                  # Print commands without executing
  hide_signs: true                # Hide traffic signs in visualization
  dir: null                       # Output dir (null = <exp>/gifs)
  run_name: null                  # Custom run name (null = timestamp)

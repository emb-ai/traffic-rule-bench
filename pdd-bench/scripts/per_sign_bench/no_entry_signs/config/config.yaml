# No-Entry Signs (3.1 / 3.2) Benchmark Configuration
# Family of no-entry / movement-prohibited signs. Default member: 3.1.
# See README.md and lib/no_entry_sign_spec.py.

defaults:
  - _self_

# Hydra output directory configuration
hydra:
  run:
    dir: ${paths.output_base}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

# =============================================================================
# Active sign in the no-entry family
# =============================================================================
# Switch member without code changes, e.g.:
#   python generate_manifest.py sign.pdd_code=3.2
sign:
  pdd_code: "3.1"               # One of: 3.1, 3.2
  # Sign is placed on the forbidden (destination) lane past the junction.

# =============================================================================
# Path Configuration
# =============================================================================
paths:
  scenes_base: scenes
  scenes_dir: null              # auto → scenes/<pdd_slug>, e.g. scenes/3_1
  output_base: benchmark_output/${pdd_slug:${sign.pdd_code}}
  experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

# =============================================================================
# Scenario Generation
# =============================================================================
scenario:
  n_variants: 1                   # Extra repeats per through-path scenario
  augment: true                   # Enumerate through-path spawn/dest variants
  max_scenarios: null                # Cap total manifest rows (null = all)
  max_scenarios_per_scene: 1      # Cap through-path variants per crop (null = all)
  respect_scene_selection: true  # Skip scenes marked reject in scene_selection.json
  min_ego_lane_m: 8.0            # Min ego approach lane length
  validate_metadrive_routes: true

# =============================================================================
# Simulation Parameters
# =============================================================================
simulation:
  spawn_velocity_ms: 2.5          # Ego initial velocity (m/s)
  traffic_density: 0.0            # Background traffic [0.0 - 1.0]
  horizon: 600                    # Max simulation steps
  # Sign on the forbidden (destination) lane, past the junction so a
  # compliant stop is not right in the intersection.
  sign_distance_from_start: 10.0
  # Route endpoint is this far *past* the sign on the forbidden lane.
  # Non-compliant agents that cross the sign end here (no long drive beyond).
  # Forbidden lane must be longer than sign_distance_from_start + this value,
  # otherwise the route end collapses onto the sign and violations never fire.
  destination_past_sign_m: 8.0
  # Ego still spawns on the approach arm, before the junction.
  spawn_distance_before_end: 25.0 # Ego spawn offset from approach lane end (m)
  # Legacy field kept for Hydra/tool compatibility; placement ignores it.
  sign_distance_before_end: 0.0
  # ONLY for sign-compliant stop before the line: treat as arrive_dest / end.
  # Does not change arrive_dest for any other case (timeout, out-of-road, etc.).
  compliant_stop_success_seconds: 3.0
  compliant_stop_max_dist_m: 12.0   # Must be within this distance before the sign line
  compliant_stop_speed_mps: 0.5     # Max speed to count as "stopped"

# =============================================================================
# Auxiliary Agents
# =============================================================================
# Off: the no-entry task is stop-before-sign compliance, not junction priority.
auxiliary:
  enabled: false
  distance_from_intersection: 20.0
  convoy_size: 3
  lanes_occupied: 4
  convoy_gap_m: 10.0

# =============================================================================
# GIF Visualization
# =============================================================================
gif:
  enabled: false
  policy: idm
  max_scenes: null
  dry_run: false
  hide_signs: true
  dir: null
  run_name: null
  model_path: null

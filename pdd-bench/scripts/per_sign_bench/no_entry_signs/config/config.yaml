# No-Entry Signs (3.1 / 3.2) Benchmark Configuration
# Family of no-entry / movement-prohibited signs. Default member: 3.1.
# See README.md and lib/no_entry_sign_spec.py.

defaults:
  - _self_

# Hydra output directory configuration
hydra:
  run:
    dir: ${paths.output_base}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

# =============================================================================
# Active sign in the no-entry family
# =============================================================================
# Switch member without code changes, e.g.:
#   python generate_manifest.py sign.pdd_code=3.2
sign:
  pdd_code: "3.1"               # One of: 3.1, 3.2
  # Catalog distance_from_start is used as the exact sign placement.

# =============================================================================
# Path Configuration
# =============================================================================
paths:
  scenes_base: scenes
  scenes_dir: null              # auto → scenes/<pdd_slug>, e.g. scenes/3_1
  output_base: benchmark_output/${pdd_slug:${sign.pdd_code}}
  experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

# =============================================================================
# Scenario Generation
# =============================================================================
scenario:
  n_variants: 1
  max_scenarios_per_scene: 1
  respect_scene_selection: true
  # Ego spawn margin before the catalog sign line (meters).
  spawn_margin_before_sign_m: 15.0
  # Drop scenes whose signed edge cannot host spawn-before / drive-past.
  min_sign_distance_from_start_m: 8.0
  min_length_past_sign_m: 3.0
  # Destination hops past the signed edge (baseline drives through the sign).
  destination_hops: 2
  validate_metadrive_routes: true

# =============================================================================
# Simulation Parameters
# =============================================================================
simulation:
  spawn_velocity_ms: 2.5
  traffic_density: 0.0
  horizon: 600
  # Unused for catalog placement (kept for Hydra compatibility with shared tools).
  sign_distance_before_end: 0.0
  spawn_distance_before_end: 0.0

# =============================================================================
# Auxiliary Agents
# =============================================================================
# Off: the no-entry task is stop-before-sign compliance, not junction priority.
auxiliary:
  enabled: false
  distance_from_intersection: 20.0
  convoy_size: 3
  lanes_occupied: 4
  convoy_gap_m: 10.0

# =============================================================================
# GIF Visualization
# =============================================================================
gif:
  enabled: false
  policy: idm
  max_scenes: null
  dry_run: false
  hide_signs: true
  dir: null
  run_name: null
  model_path: null

# Direction Signs (4.1.1–4.1.6) Benchmark Configuration
# Family of mandatory movement-direction signs. Default member: 4.1.1.
# See README.md and lib/direction_sign_spec.py.

defaults:
  - _self_

# Hydra output directory configuration
hydra:
  run:
    dir: ${paths.output_base}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

# =============================================================================
# Active sign in the 4.1.x family
# =============================================================================
# Switch member without code changes, e.g.:
#   python generate_manifest.py sign.pdd_code=4.1.2
sign:
  pdd_code: "4.1.1"             # One of: 4.1.1 … 4.1.6

# =============================================================================
# Path Configuration
# =============================================================================
paths:
  scenes_base: scenes
  scenes_dir: null
  output_base: benchmark_output/${pdd_slug:${sign.pdd_code}}
  experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

# =============================================================================
# Scenario Generation
# =============================================================================
scenario:
  n_variants: 1                   # Extra repeats per dual-path scenario
  augment: true                   # Reserved; dual-path used for 4.1.1 / 4.1.2 / 4.1.3
  max_scenarios_per_scene: 5      # Dual-path scenarios per cropped scene
  respect_scene_selection: true  # Skip scenes marked reject in scene_selection.json
  min_dual_path_gain_m: 20.0     # Min (compliant_len - baseline_len) in meters
  min_ego_lane_m: 8.0            # Min ego approach lane length
  # Drop dests MetaDrive cannot route (shortest_path max_len=10). Prevents empty GIFs.
  validate_metadrive_routes: true

# =============================================================================
# Simulation Parameters
# =============================================================================
simulation:
  spawn_velocity_ms: 2.5          # Ego initial velocity (m/s)
  traffic_density: 0.0            # Used when traffic_density_augment=false
  # 3 nuPlan-derived density levels per scenario (see lib/traffic_density_levels.py)
  traffic_density_augment: true
  horizon: 600                    # Max simulation steps
  sign_distance_before_end: 0.0   # Sign offset from lane end (m)
  spawn_distance_before_end: 20.0 # Ego spawn offset from lane end (m)

# =============================================================================
# GIF Visualization
# =============================================================================
gif:
  enabled: false                   # Generate visualization GIFs
  policy: idm                     # idm | modified_idm | carl_rule | ...
  max_scenes: null                # Limit GIFs (null = all)
  dry_run: false                  # Print commands without executing
  hide_signs: true                # Hide traffic signs in visualization
  dir: null                       # Output dir (null = <exp>/gifs)
  run_name: null                  # Custom run name (null = timestamp)
  # For carl/carl_rule/plant2: omit to use pdd-bench/checkpoints/... default
  model_path: null

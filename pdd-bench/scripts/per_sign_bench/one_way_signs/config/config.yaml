# One-Way Entry Signs (5.7.1 / 5.7.2) Benchmark Configuration
# Family of one-way-entry signs. Default member: 5.7.1.
# See README.md and lib/one_way_sign_spec.py.

defaults:
  - _self_

# Hydra output directory configuration
hydra:
  run:
    dir: ${paths.output_base}/${paths.experiment_name}
  output_subdir: .hydra
  job:
    chdir: false

# =============================================================================
# Active sign in the one-way family
# =============================================================================
# Switch member without code changes, e.g.:
#   python generate_manifest.py sign.pdd_code=5.7.2
sign:
  pdd_code: "5.7.1"             # One of: 5.7.1, 5.7.2
  # Manifest uses dual-path spawn/dest (forbidden shorter, allowed longer).

# =============================================================================
# Path Configuration
# =============================================================================
paths:
  scenes_base: scenes
  scenes_dir: null              # auto → scenes/<pdd_slug>, e.g. scenes/5_7_1
  output_base: benchmark_output/${pdd_slug:${sign.pdd_code}}
  experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

# =============================================================================
# Scenario Generation
# =============================================================================
scenario:
  n_variants: 1                   # Extra repeats per dual-path scenario
  augment: true                   # Reserved; dual-path used for all members
  max_scenarios: null             # Cap dual-path picks (null = all); density tiers multiply rows only if traffic_density_augment=true
  max_scenarios_per_scene: 5      # Dual-path scenarios per cropped scene
  respect_scene_selection: true  # Skip scenes marked reject in scene_selection.json
  min_dual_path_gain_m: 20.0     # Min (straight_len - turn_len) in meters
  min_ego_lane_m: 8.0            # Min ego approach lane length
  # Drop dests MetaDrive cannot route (shortest_path max_len=10). Prevents empty GIFs.
  validate_metadrive_routes: true

# =============================================================================
# Simulation Parameters
# =============================================================================
simulation:
  spawn_velocity_ms: 2.5          # Ego initial velocity (m/s)
  # Background traffic. When traffic_density_augment=true, generate_manifest
  # multiplies each dual-path scenario by nuPlan density tiers (td1..tdN) and
  # ignores this scalar. Set augment=false to emit one row per scenario with
  # this fixed density (0.0 = no background traffic).
  traffic_density: 0.0            # Used only if traffic_density_augment=false
  traffic_density_augment: true   # false → no density-tier augmentation
  horizon: 600                    # Max simulation steps
  sign_distance_before_end: 0.0   # Sign offset from lane end (m)
  spawn_distance_before_end: 20.0 # Ego spawn offset from lane end (m)

# =============================================================================
# Auxiliary Agents
# =============================================================================
# Off: the one-way task is route compliance (same as 4.1.x / 3.18.x dual-path).
auxiliary:
  enabled: false
  distance_from_intersection: 20.0
  convoy_size: 3
  lanes_occupied: 4
  convoy_gap_m: 10.0

# =============================================================================
# GIF Visualization
# =============================================================================
gif:
  enabled: false
  policy: idm                     # idm | modified_idm | carl_rule | ...
  max_scenes: null
  dry_run: false
  hide_signs: true
  dir: null
  run_name: null
  model_path: null

# Per-sign scene allocation from the shared Moscow junction pool.
# Canonical config (allocate_sign_scenes.py reads this file).
# signs.json is a generated twin written by allocate_sign_scenes.py.
#
# x_share = fraction of X among {T,X} maps (0.5 → 50/50). Same idea as x_frac.
# Global train/test split is by scene_id (make_junction_split.py).
# Signs share train_ids / test_ids; a junction may appear in several signs.
#
# Quotas below are the target number of *maps per sign* (kept after review).
# OSM download size is unrelated — see raw/DOWNLOAD_META.json.

seed: 42
test_frac: 0.2
n_train: 80
n_test: 20   # ≈ n_train * test_frac / (1 - test_frac)

signs:
  "2.1": { shapes: [T, X], x_share: 0.5 }
  # Unified 2.3 family: X→2.3.1 plates, T→2.3.2+2.3.3 on opposite main arms.
  "2.3": { shapes: [T, X], x_share: 0.5 }
  "2.4": { shapes: [T, X], x_share: 0.5 }
  "2.5": { shapes: [T, X], x_share: 0.5 }
  "3.18.1": { shapes: [T, X], x_share: 0.5 }
  "3.18.2": { shapes: [T, X], x_share: 0.5 }
  "4.1.1": { shapes: [T, X], x_share: 0.5 }
  "4.1.2": { shapes: [T, X], x_share: 0.5 }
  "4.1.3": { shapes: [T, X], x_share: 0.5 }
  "4.1.4": { shapes: [T, X], x_share: 0.5 }
  "4.1.5": { shapes: [T, X], x_share: 0.5 }
  "4.1.6": { shapes: [T, X], x_share: 0.5 }
  "4.3": { shapes: [O] }
  "5.7.1": { shapes: [T] }
  "5.7.2": { shapes: [T] }
  "5.15.1": { shapes: [T, X], x_share: 0.5 }
  "5.15.2": { shapes: [T, X], x_share: 0.5 }

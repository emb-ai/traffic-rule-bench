# Per-sign scene allocation from the shared Moscow scene pool.
# Canonical config (allocate_sign_scenes.py reads this file).
# signs.json is a generated twin written by allocate_sign_scenes.py.
#
# crop_kind:
#   junction        → scenes/{T,X,O}/
#   dual_path       → scenes/dual_path/{T,X}/{slot}/  (filter via lib.roles.sign_to_slots)
#   lane_direction  → scenes/lane_direction/{T,X}/    (5.15.1 multi-lane LC atoms)
#
# x_share = fraction of X among {T,X} maps (0.5 → 50/50). Same idea as x_frac.
# Prefer global train/test split by junction_id (make_junction_split.py).
# Signs share train/test pools; a junction may appear in several signs.
#
# Quotas below are the target number of *maps per sign* (kept after review).

seed: 42
test_frac: 0.2
n_train: 80
n_test: 20   # ≈ n_train * test_frac / (1 - test_frac)

signs:
  "2.1": { crop_kind: junction, shapes: [T, X], x_share: 0.5 }
  # Unified 2.3 family: X→2.3.1 plates, T→2.3.2+2.3.3 on opposite main arms.
  "2.3": { crop_kind: junction, shapes: [T, X], x_share: 0.5 }
  "2.4": { crop_kind: junction, shapes: [T, X], x_share: 0.5 }
  "2.5": { crop_kind: junction, shapes: [T, X], x_share: 0.5 }
  "3.2": { crop_kind: junction, shapes: [T, X], x_share: 0.5 }
  # 3.1: dual-path, all 6 slots; allocate balances slots evenly (see allocate_sign_scenes).
  "3.1": { crop_kind: dual_path, shapes: [T, X], x_share: 0.5 }
  "3.18.1": { crop_kind: dual_path, shapes: [T, X], x_share: 0.5 }
  "3.18.2": { crop_kind: dual_path, shapes: [T, X], x_share: 0.5 }
  "4.1.1": { crop_kind: dual_path, shapes: [X] }
  "4.1.2": { crop_kind: dual_path, shapes: [T, X], x_share: 0.5 }
  "4.1.3": { crop_kind: dual_path, shapes: [T, X], x_share: 0.5 }
  "4.1.4": { crop_kind: dual_path, shapes: [X] }
  "4.1.5": { crop_kind: dual_path, shapes: [X] }
  "4.1.6": { crop_kind: dual_path, shapes: [T, X], x_share: 0.5 }
  "4.3": { crop_kind: junction, shapes: [O] }
  "5.7.1": { crop_kind: dual_path, shapes: [T] }
  "5.7.2": { crop_kind: dual_path, shapes: [T] }
  # 5.15.1 (= former 5.15.1+5.15.2): multi-lane approach, peer LC required for turn.
  "5.15.1": { crop_kind: lane_direction, shapes: [T, X], x_share: 0.5 }

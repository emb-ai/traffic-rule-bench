# Fixed hyperparameters for single-trajectory 2.5 overfit (edit here, not in .py).
#
# Paths under shepelev: are resolved relative to $SHEPELEV unless absolute.
# Run:
#   python tools/overfit_1traj_sweep.py --config tools/configs/overfit_1traj.yaml --gpu 0

paths:
  trajectory: sign_100062_j0_lane0_seed1974118946_v0_default
  split: plant2_l1_fv_experts_split_signs_2.5_1traj
  ds_local: /tmp/plant2_ds_cache_2p5_tsfix
  metrics_root: plant2_ft_metrics/overfit_2p5_1traj_bins10_cw_eval
  log_path: plant2_ft_metrics/overfit_2p5_1traj_experiment_log.txt
  pretrain_ckpts:
    final_1: plant2_checkpoints/epoch=029_final_1.ckpt
    final_2: plant2_checkpoints/epoch=029_final_2.ckpt

run:
  checkpoint_addon: overfit_2p5_1traj_e15_bins10_cw_lr5e4_sw1p5
  eval_tag: overfit_2p5_1traj_e15_bins10_cw_lr5e4_sw1p5_eval

train:
  pretrain: final_1
  learning_rate: "5e-4"
  max_epochs: 15
  batch_size: 32
  num_workers: 4
  ckpt_every_n_epochs: 5
  lr_scheduler: cosine_warmup
  warmup_ratio: 0.1
  seed: 1
  augment: false
  augment_parked: false
  filter_routes: false
  stop_speed_loss_weight: 1.0
  path_weight: 0
  speed_weight: 1.5
  speed_class_weights: [15, 15, 10, 1, 1, 1, 1, 1, 1, 1]
  weight_decay: 0.1
  forecast_loss_weight: 1.0
  input_ego_speed: false

eval:
  slot: last
  save_gifs: true
  save_predictions: true
  force_rerun: true

success:
  steps_max: 400.0
  sign_sr_min: 1.0
  dest_rate_min: 1.0
